<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <!-- Cloud FinOps Gradient -->
    <linearGradient id="finops-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Arbitrage Balance Accent -->
    <linearGradient id="arbitrage-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="core-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="160" fill="url(#bg-grad)" />
  <rect width="796" height="796" x="2" y="2" rx="158" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Cloud Infrastructure Mesh & Routing Orbit -->
  <g opacity="0.16" stroke="#06B6D4" stroke-width="1.5">
    <circle cx="400" cy="380" r="140" fill="none" stroke-dasharray="6 6" />
    <circle cx="400" cy="380" r="230" fill="none" stroke-dasharray="8 8" />
    <line x1="400" y1="100" x2="400" y2="660" stroke-dasharray="4 8" />
    <line x1="120" y1="380" x2="680" y2="380" stroke-dasharray="4 8" />
  </g>

  <!-- The Arbitrage Cloud Contour (Main Hero Symbol) -->
  <path d="M 310 470 
           L 500 470 
           A 75 75 0 0 0 575 395 
           A 65 65 0 0 0 535 295 
           A 85 85 0 0 0 375 270 
           A 70 70 0 0 0 250 350 
           A 65 65 0 0 0 310 470 Z" 
        fill="url(#core-glow)" 
        stroke="url(#finops-grad)" 
        stroke-width="10" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Dynamic Envoy Delta xDS Proxy Stream Curves -->
  <!-- L4/L7 Flow Ingress to Egress -->
  <g stroke="url(#arbitrage-grad)" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#subtle-glow)">
    <!-- Spot Instance Flow (Lower cost green lane) -->
    <path d="M 230 400 Q 340 370, 400 370 T 570 340" />
    <!-- On-Demand Fallback Flow (Steady blue lane) -->
    <path d="M 230 430 Q 340 450, 400 420 T 570 420" stroke="#06B6D4" stroke-dasharray="8 6" />
  </g>

  <!-- Dual-Tier Compute Nodes (Spot vs On-Demand Arbitrage Hubs) -->
  <!-- Center Envoy Gateway / xDS Core Hub -->
  <circle cx="400" cy="390" r="24" fill="#111827" stroke="#10B981" stroke-width="4" filter="url(#subtle-glow)" />
  <polygon points="392,380 412,390 392,400" fill="#10B981" />

  <!-- Spot Node (Dynamic / Cost Conscious) -->
  <g filter="url(#subtle-glow)">
    <circle cx="530" cy="340" r="14" fill="#10B981" />
    <circle cx="530" cy="340" r="22" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3" />
  </g>

  <!-- On-Demand Node (Rock Solid) -->
  <g filter="url(#subtle-glow)">
    <circle cx="530" cy="420" r="14" fill="#0284C7" />
    <rect x="522" y="412" width="16" height="16" rx="3" fill="#F8FAFC" opacity="0.3" />
  </g>

  <!-- FinOps Conscious Leaf Accent (Energy & Carbon Efficiency) -->
  <path d="M 400 240 C 430 200, 460 210, 460 240 C 460 270, 420 270, 400 240 Z" fill="#10B981" stroke="#F8FAFC" stroke-width="2" opacity="0.85" filter="url(#subtle-glow)" />

  <!-- Typography -->
  <text x="400" y="685" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="4">
    CONSCIOUS<tspan fill="#10B981">CLOUD</tspan>
  </text>
  <text x="400" y="722" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="3">
    AUTONOMOUS COMPUTE ARBITRAGE &amp; ENVOY XDS
  </text>
</svg>
